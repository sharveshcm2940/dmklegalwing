# /etc/nginx/sites-available/dmk-legal-wing
# Site at the root of its own (sub)domain. For a sub-path of the main site see README.md, "Linking it with the main website".
server {
    listen 80;
    server_name legalwing.example.org;
    # After you get a certificate (certbot --nginx), the site must be served over https.

    client_max_body_size 16m;
    root /var/www/dmk-legal-wing/client-dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/www/dmk-legal-wing/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # Uploaded files must never run as pages or scripts.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React routes: send everything else to index.html
    location / {
        try_files $uri /index.html;
    }
}
